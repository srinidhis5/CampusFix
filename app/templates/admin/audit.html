{% extends "base.html" %}
{% block content %}
<h1>Audit log</h1>
<table class="table bg-white"><tr><th>Time</th><th>Actor</th><th>Action</th><th>Description</th></tr>{% for l in logs %}<tr><td>{{ l.created_at.strftime('%Y-%m-%d %H:%M') }}</td><td>{{ l.actor.full_name if l.actor else 'System' }}</td><td>{{ l.action }}</td><td>{{ l.description }}</td></tr>{% endfor %}</table>
{% endblock %}
